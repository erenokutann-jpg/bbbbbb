<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ☕️🍸🍻💖 </title>

    <!-- WebP görselleri için ön yükleme -->
    <link rel="preload" as="image" href="number11.webp">
    <link rel="preload" as="image" href="number17.webp">
    <link rel="preload" as="image" href="number18.webp">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2d122d 0%, #0f172a 100%);
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(30, 20, 40, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(236, 72, 153, 0.15), 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(236, 72, 153, 0.25);
            z-index: 10;
        }

        h1 {
            font-size: 19px;
            font-weight: 600;
            color: #fdf2f8;
            min-height: 65px;
            margin: 10px 0 20px 0;
            line-height: 1.45;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-wrapper {
            width: 100%;
            max-width: 240px;
            height: 200px;
            margin-bottom: 25px;
            position: relative;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: opacity 0.15s ease;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 60px;
            position: relative;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fdf2f8;
            border: 1px solid rgba(236, 72, 153, 0.4);
            width: 100%;
            margin-bottom: 5px;
        }

        .option-btn:hover {
            background: rgba(236, 72, 153, 0.3);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(236, 72, 153, 0.45);
            z-index: 100;
            width: 100%;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(236, 72, 153, 0.5);
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            font-size: 16px;
            outline: none;
            text-align: center;
            color-scheme: dark;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Açılış Başlığı -->
    <h1 id="question">Merhaba Gecoshka Lütfen müsait olduğun tarihi seçer misin ☕️🍸🍻</h1>
    
    <div class="img-wrapper">
        <!-- 1. Görsel: number11.webp -->
        <img id="anaGorsel" src="number11.webp" alt="Görsel">
    </div>
    
    <div class="buttons" id="buttonArea">
        <input type="date" id="tarihInput">
        <button id="yesBtn" onclick="takvimTarihiKaydet()">Tarihi Onayla 🚀</button>
    </div>
</div>

<script>
    const webpListesi = ["number11.webp", "number17.webp", "number18.webp"];
    const yuklenenGorseller = {};

    // Görselleri önceden belleğe yükle
    webpListesi.forEach(src => {
        const img = new Image();
        img.src = src;
        yuklenenGorseller[src] = img;
    });

    let secilenTarih = "";
    let secilenSaat = "";

    // Sayfa ilk açıldığında bugünün tarihini minimum sınır olarak ayarla
    document.addEventListener("DOMContentLoaded", () => {
        const bugun = new Date().toISOString().split('T')[0];
        document.getElementById('tarihInput').min = bugun;
    });

    function gorselDegistir(yeniSrc) {
        const resim = document.getElementById('anaGorsel');
        resim.style.opacity = '0.5';
        
        if (yuklenenGorseller[yeniSrc] && yuklenenGorseller[yeniSrc].complete) {
            resim.src = yeniSrc;
            resim.style.opacity = '1';
        } else {
            const tempImg = new Image();
            tempImg.src = yeniSrc;
            tempImg.onload = () => {
                resim.src = yeniSrc;
                resim.style.opacity = '1';
            };
        }
    }

    function takvimTarihiKaydet() {
        const inputVal = document.getElementById('tarihInput').value;
        if (!inputVal) {
            alert("Lütfen bir tarih seçiniz!");
            return;
        }

        const parcalar = inputVal.split('-');
        secilenTarih = `${parcalar[2]}/${parcalar[1]}/${parcalar[0]}`;

        saatEkraniGetir();
    }

    function saatEkraniGetir() {
        document.getElementById('question').innerHTML = "şimdi sıraa saatte ⏰";
        
        // 2. Görsel: number18.webp
        gorselDegistir("number18.webp");

        const buttonArea = document.getElementById('buttonArea');
        buttonArea.innerHTML = `
            <button class="option-btn" onclick="saatSec('17:00')">17:00</button>
            <button class="option-btn" onclick="saatSec('19:00')">19:00</button>
            <button class="option-btn" onclick="saatSec('20:30')">20:30</button>
            <button class="option-btn" onclick="saatSec('21:30')">21:30</button>
        `;
    }

    function saatSec(saat) {
        secilenSaat = saat;
        document.getElementById('question').innerHTML = "Harika! Sözleştik 🚀<br><small style='font-size: 13px; color: #ec4899; display:block; margin-top:8px;'>WhatsApp'a yönlendiriliyorsun...</small>";

        // 3. Görsel (Son Adım): number17.webp
        gorselDegistir("number17.webp");

        const buttonArea = document.getElementById('buttonArea');
        buttonArea.innerHTML = `
            <button id="yesBtn" style="transform: scale(1.05);" onclick="whatsappGonder()">WhatsApp'a Geç 💬</button>
        `;
    }

    function whatsappGonder() {
        const telefonNumarasi = "905071265840"; 
        const mesaj = encodeURIComponent(`${secilenTarih} saat ${secilenSaat} için sözleştik! ☕️✨`);
        
        window.location.href = `https://wa.me/${telefonNumarasi}?text=${mesaj}`;
    }
</script>

</body>
</html>
